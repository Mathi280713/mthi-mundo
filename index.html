<style>

#mapbox{position:relative;width:100%;aspect-ratio:1400/1320;border-radius:14px;overflow:hidden;background:#0a2b4d;border:1px solid var(--ln)}

.pin{position:absolute;transform:translate(-50%,-50%);font-size:17px;background:rgba(0,0,0,.45);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.4);touch-action:manipulation}
.pin.me{background:#ff3b3b;border-color:#fff;width:14px;height:14px;font-size:0}.pin.fd{border-color:var(--ac2)}

.lm{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--ln)}.lm .e{font-size:22px;width:32px;text-align:center}.lm div{flex:1;min-width:0}.lm small{display:block;color:var(--mu)}.lm button{padding:8px 14px;border-radius:10px;border:0;background:var(--ac);color:#05200f;font-weight:800;touch-action:manipulation}

.stat{display:flex;justify-content:space-around;text-align:center;margin:10px 0}.stat b{display:block;font-size:24px}.stat span{color:var(--mu);font-size:12px}

#load.off{opacity:0;pointer-events:none}.lw{width:min(340px,86vw)}.lg{font-size:64px}.lw h1{margin:6px 0;font-size:30px;letter-spacing:.02em}.lw p{color:var(--mu);margin:8px 0}.lw small{color:#6e9a80;display:block;margin-top:16px;font-size:12px}
.lb{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}.lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .2s}
#rot{display:none}
@media (orientation:portrait){#rot{display:block;position:absolute;left:50%;top:44%;transform:translateX(-50%);background:var(--glass2);padding:8px 14px;border-radius:12px;font-size:13px;pointer-events:none;z-index:4}#hotbar{max-width:calc(100vw - 20px);bottom:150px}}

<script>
/* ===== Mthi Mundo: utilidades, ruido y matrices ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ok */ } };
const jget = (k, d) => { try { const v = JSON.parse(lsGet(k)); return v == null ? d : v; } catch (e) { return d; } };
const jset = (k, v) => lsSet(k, JSON.stringify(v));
function hash2(x, z, s) { let h = Math.imul(x | 0, 374761393) + Math.imul(z | 0, 668265263) + Math.imul(s | 0, 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, z, s) { const xi = Math.floor(x), zi = Math.floor(z), u = smooth(x - xi), v = smooth(z - zi); const a = hash2(xi, zi, s), b = hash2(xi + 1, zi, s), c = hash2(xi, zi + 1, s), d = hash2(xi + 1, zi + 1, s); return lerp(lerp(a, b, u), lerp(c, d, u), v); }
function fbm(x, z, o, s) { let a = 1, f = 1, t = 0, n = 0; for (let i = 0; i < o; i++) { t += vnoise(x * f, z * f, s + i * 17) * a; n += a; a *= 0.5; f *= 2; } return t / n; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/* matrices 4x4 (columnas) */
const M4 = {
  mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; },
  persp(fov, asp, n, f) { const t = 1 / Math.tan(fov / 2), o = new Float32Array(16); o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o; },
  view(ex, ey, ez, yaw, pit) { const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pit), sp = Math.sin(pit); const fx = sy * cp, fy = sp, fz = -cy * cp; const rx = cy, ry = 0, rz = sy; const ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx; const o = new Float32Array(16); o[0] = rx; o[4] = ry; o[8] = rz; o[1] = ux; o[5] = uy; o[9] = uz; o[2] = -fx; o[6] = -fy; o[10] = -fz; o[12] = -(rx * ex + ry * ey + rz * ez); o[13] = -(ux * ex + uy * ey + uz * ez); o[14] = fx * ex + fy * ey + fz * ez; o[15] = 1; return o; },
  trs(x, y, z, sx, sy, sz, ry) { const c = Math.cos(ry), s = Math.sin(ry), o = new Float32Array(16); o[0] = c * sx; o[2] = -s * sx; o[5] = sy; o[8] = s * sz; o[10] = c * sz; o[12] = x; o[13] = y; o[14] = z; o[15] = 1; return o; }
};
function planes(m) { const g = (i, j) => m[j * 4 + i]; const p = []; for (const [s, k] of [[1, 0], [-1, 0], [1, 1], [-1, 1], [1, 2], [-1, 2]]) { const a = [g(3, 0) + s * g(k, 0), g(3, 1) + s * g(k, 1), g(3, 2) + s * g(k, 2), g(3, 3) + s * g(k, 3)]; const l = Math.hypot(a[0], a[1], a[2]) || 1; p.push([a[0] / l, a[1] / l, a[2] / l, a[3] / l]); } return p; }

/* ===== Bloques y atlas de texturas (todo dibujado con código) ===== */
const TILES = [], TI = {};
function tile(name, fn) { TI[name] = TILES.length; TILES.push(fn); }
const nz = (base, amp) => (x, y, r) => { const k = 1 + (r() * 2 - 1) * amp; return [base[0] * k, base[1] * k, base[2] * k, 255]; };
const cl = (v) => (v < 0 ? 0 : v > 255 ? 255 : v | 0);
tile('grass_top', nz([84, 152, 50], 0.1));
tile('grass_side', (x, y, r) => { const d = y < 3 + (r() < 0.4 ? 1 : 0); const k = 1 + (r() * 2 - 1) * 0.1; return d ? [84 * k, 152 * k, 50 * k, 255] : [121 * k, 85 * k, 58 * k, 255]; });
tile('dirt', nz([121, 85, 58], 0.12));
tile('stone', (x, y, r) => { const b = 0.88 + 0.2 * vnoise(x * 0.5, y * 0.5, 3) + (r() - 0.5) * 0.08; return [128 * b, 128 * b, 132 * b, 255]; });
tile('sand', nz([222, 206, 150], 0.05));
tile('water', (x, y, r) => { const k = 1 + (r() - 0.5) * 0.08; return [44 * k, 112 * k, 200 * k, 165]; });
tile('log_side', (x, y, r) => { const k = 0.85 + 0.25 * (x % 4 === 0 ? 0 : 1) * r(); return [104 * k, 76 * k, 46 * k, 255]; });
tile('log_top', (x, y, r) => { const d = Math.hypot(x - 7.5, y - 7.5), k = 0.8 + 0.3 * ((d | 0) % 2) + (r() - 0.5) * 0.06; return d > 7 ? [90 * 0.9, 66 * 0.9, 40 * 0.9, 255] : [190 * k, 150 * k, 96 * k, 255]; });

  if (P.inCar) { const j = Jeep.b, h = Jeep.heading; let dist = 7.2, cx, cy, cz; for (let k = 0; k < 6; k++) { cx = j.x - Math.sin(h) * dist; cz = j.z + Math.cos(h) * dist; cy = Math.max(j.y + 3.4, W.topY(Math.floor(cx), Math.floor(cz)) + 2.2); if (!SOL[W.get(Math.floor(cx), Math.floor(cy), Math.floor(cz))]) break; dist -= 1.2; } cam = { x: cx, y: cy, z: cz, yaw: P.yaw, pit: -0.2 + Math.atan2(j.y + 1.5 - cy, dist) * 0.9, fov: SET.fov + Math.min(0.25, Math.abs(Jeep.speed) * 0.008) }; }
  else if (P.third) { const e = P.eye(), d = P.dir(); let dist = 4.2; for (; dist > 0.6; dist -= 0.4) { if (!SOL[W.get(Math.floor(e[0] - d[0] * dist), Math.floor(e[1] - d[1] * dist + 0.3), Math.floor(e[2] - d[2] * dist))]) break; } cam = { x: e[0] - d[0] * dist, y: e[1] - d[1] * dist + 0.3, z: e[2] - d[2] * dist, yaw: P.yaw, pit: P.pit, fov: SET.fov }; }
  else { const e = P.eye(); cam = { x: e[0], y: e[1], z: e[2], yaw: P.yaw, pit: P.pit, fov: zoom ? WEAP[WLIST[Duel.wi]].zoom : SET.fov }; }
  const ents = []; Fauna.ents(ents); Duel.ents(ents); Jeep.ents(ents); Race.ents(ents); if (P.third && !P.inCar && !Duel.on) drawHuman(ents, b.x, P.camY, b.z, P.yaw, P.walkPh, MySkin, 0, null); else if (Duel.on && P.third) drawHuman(ents, b.x, P.camY, b.z, P.yaw, P.walkPh, MySkin, 0, WLIST[Duel.wi]);
  const view = []; if (!P.inCar && !zoom && !P.third) { const bob = Math.sin(Game.t * 9) * 0.008 * Math.min(1, Math.hypot(b.vx, b.vz) / 4) * (b.ground ? 1 : 0); if (Duel.on) { const w = WEAP[WLIST[Duel.wi]], kick = Math.max(0, (Duel.cool || 0) / w.rate) * 0.07; view.push({ m: mat(0.2, -0.19 + bob, -0.4 - w.len * 0.5 + kick, 0.06, 0.09, w.len, 0, 0), c: w.col, fl: 0 }); view.push({ m: mat(0.2, -0.26 + bob, -0.22 + kick, 0.05, 0.1, 0.07, 0, 0.2), c: [0.55, 0.38, 0.25], fl: 0 }); if (Duel.cool > w.rate - 0.05) view.push({ m: mat(0.2, -0.17, -0.42 - w.len - 0.04, 0.06, 0.06, 0.06, 0, 0), c: [1, 0.85, 0.3], fl: 0.8 }); } else if (b.fly || true) { const id = P.bar[P.sel]; if (id && BL[id] && !CRS[id]) { const c = avgCol(id); view.push({ m: mat(0.3, -0.26 + bob, -0.5, 0.11, 0.11, 0.11, 0.5, 0.2), c, fl: 0.0 }); } } }
  const out = RN.frame(cam, Game.t, ents, view); HUD.overlay(out.vp, dt);
}
